<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raphaël Chaumény — Data × Supply Chain</title>
<meta name="description" content="Portfolio de Raphaël Chaumény, Supply Chain Coordinator & Data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<style>
/* ============ TOKENS ============ */
:root{
  --bg-0:#070a10;--bg-1:#0b1119;--bg-2:#111a26;--bg-3:#182437;
  --ink:#ece7da;--muted:#95a1b3;--faint:#576e81;--line:#1c2838;
  --accent:#cdaa4a;--accent-l:#e6cc7a;--accent-d:#93762f;
  --azure:#4d7fc4;--azure-l:#79a3e0;
  --emerald:#7ea577;--coral:#c4685f;--lilac:#8791b0;
  --r-sm:8px;--r-md:14px;--r-lg:22px;
  --font-display:'Cormorant Garamond',Georgia,serif;
  --font-ui:'DM Sans',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','Fira Code',monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg-0)}
body{font-family:var(--font-ui);color:var(--ink);background:var(--bg-0);overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.5}
::selection{background:var(--accent);color:var(--bg-0)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg-0)}
::-webkit-scrollbar-thumb{background:var(--faint);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
@media(pointer:fine){html,body,a,button,[role=button],.term{cursor:none!important}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

/* ============ LAYOUT PRIMITIVES ============ */
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.wrap-narrow{max-width:820px;margin:0 auto;padding:0 32px}
.section{padding:120px 0;position:relative}
.section--tint{background:var(--bg-1)}
.grid{display:grid;gap:18px}
.g-12{grid-template-columns:repeat(12,1fr)}
.g-auto-sm{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g-auto-md{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.span-7{grid-column:span 7}.span-5{grid-column:span 5}.span-12{grid-column:1/-1}
@media(max-width:980px){.span-7,.span-5{grid-column:1/-1}}

/* ============ CARD ============ */
.card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-lg);position:relative;overflow:hidden;transition:transform .45s var(--ease),box-shadow .45s var(--ease),border-color .3s}
.card--interactive{cursor:pointer}
.card--interactive:hover{transform:translateY(-6px);box-shadow:0 36px 70px rgba(0,0,0,.55);border-color:var(--accent-2,var(--accent))}
.card__glow{position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(360px circle at var(--mx,-500px) var(--my,-500px),rgba(255,255,255,.06),transparent 42%);opacity:0;transition:opacity .5s}
.card--interactive:hover .card__glow{opacity:1}

/* ============ TEXT SYSTEM ============ */
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:3px;color:var(--accent);text-transform:uppercase}
.h-section{font-family:var(--font-display);font-weight:600;font-size:clamp(36px,4.6vw,58px);letter-spacing:-.02em;line-height:1.05;color:var(--ink)}
.section-head{margin-bottom:60px}
.section-head__row{display:flex;align-items:center;gap:20px;margin-bottom:16px}
.section-head__num{font-family:var(--font-mono);font-size:11px;color:var(--accent);letter-spacing:3px}
.section-head__rule{flex:1;height:1px;background:linear-gradient(90deg,var(--accent-d),transparent)}
.lede{font-family:var(--font-ui);font-size:15px;color:var(--muted);line-height:1.75;font-weight:300}
.mono-tag{font-family:var(--font-mono);font-size:10px;letter-spacing:1.4px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:rgba(255,255,255,.02)}
.term{border-bottom:1px dashed var(--accent);color:var(--accent);position:relative}
.term:hover::after{content:attr(data-def);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:rgba(10,17,28,.96);border:1px solid var(--accent);color:var(--ink);padding:8px 12px;border-radius:8px;font-size:11px;font-family:var(--font-ui);white-space:normal;width:max-content;max-width:220px;z-index:1000;text-align:center;pointer-events:none}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;gap:9px;font-family:var(--font-ui);font-size:14px;font-weight:600;text-decoration:none;border-radius:10px;padding:14px 30px;transition:transform .25s var(--ease),box-shadow .25s}
.btn--solid{background:linear-gradient(135deg,var(--accent-d),var(--accent));color:var(--bg-0);box-shadow:0 8px 28px rgba(205,170,74,.3)}
.btn--solid:hover{transform:translateY(-3px)}
.btn--ghost{border:1px solid var(--faint);color:var(--muted)}
.btn--ghost:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg-3);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
.icon-btn:hover{color:var(--accent);border-color:var(--accent)}

/* ============ REVEAL ============ */
.reveal{opacity:0;transform:translateY(26px) scale(.985);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.reveal.on{opacity:1;transform:none}

/* ============ PRELOADER ============ */
#preloader{position:fixed;inset:0;z-index:9999;background:var(--bg-0);display:flex;align-items:center;justify-content:center;transition:opacity .7s var(--ease),visibility .7s}
.preloader__mark{width:56px;height:56px;animation:pulse-glow 2s ease-in-out infinite}
@keyframes pulse-glow{0%,100%{opacity:1;transform:scale(1);filter:drop-shadow(0 0 12px var(--accent))}50%{opacity:.5;transform:scale(.94);filter:drop-shadow(0 0 2px var(--accent))}}

/* ============ CURSOR / PROGRESS ============ */
#scroll-line{position:fixed;top:0;left:0;z-index:9997;height:2px;width:0;background:linear-gradient(90deg,var(--accent-d),var(--accent),var(--accent-l));box-shadow:0 0 10px var(--accent);transition:width .08s linear}
#cursor-dot{position:fixed;z-index:9999;width:8px;height:8px;border-radius:50%;background:var(--accent);pointer-events:none;top:0;left:0;transition:transform .04s linear;display:none}
#cursor-ring{position:fixed;z-index:9998;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--accent);pointer-events:none;top:0;left:0;transition:transform .13s ease,opacity .25s;display:none}

/* ============ NAV ============ */
#navbar{position:fixed;top:0;left:0;right:0;z-index:500;padding:20px 0;transition:background .4s,backdrop-filter .4s,border-color .4s}
.navbar__inner{max-width:1240px;margin:0 auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:13px;text-decoration:none}
.brand__name{font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:2px;color:var(--ink);line-height:1}
.brand__tag{font-family:var(--font-mono);font-size:9px;letter-spacing:3px;color:var(--accent);margin-top:2px}
.pcnav{display:flex;gap:2px;align-items:center}
.nav-link{padding:8px 15px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:13px;transition:color .2s,background .2s}
.navbar__actions{display:flex;gap:10px;align-items:center}
.status-pill{background:rgba(126,165,119,.1);border:1px solid rgba(126,165,119,.3);color:var(--emerald);border-radius:8px;padding:7px 13px;font-size:12px;font-family:var(--font-mono);font-weight:700;display:flex;align-items:center;gap:7px}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--emerald);animation:pulse-dot 2.4s infinite}
@keyframes pulse-dot{70%,100%{box-shadow:0 0 0 8px transparent}0%{box-shadow:0 0 0 0 rgba(126,165,119,.5)}}
.dd{position:relative}
.dd-menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;overflow:hidden;z-index:700;min-width:150px;box-shadow:0 16px 48px rgba(0,0,0,.55);opacity:0;transform:translateY(-8px) scale(.96);pointer-events:none;transition:.22s;max-height:340px;overflow-y:auto}
.dd.open .dd-menu{opacity:1;transform:none;pointer-events:all}
.dd-opt{display:flex;align-items:center;gap:9px;padding:10px 15px;font-family:var(--font-mono);font-size:11px;letter-spacing:1px;color:var(--muted);border:none;background:none;width:100%;text-align:left;cursor:pointer;text-decoration:none}
.dd-opt:hover{background:var(--bg-3);color:var(--accent)}
.dd-opt.active{color:var(--accent);background:rgba(255,255,255,.04);font-weight:700}
.lang-pill{background:rgba(205,170,74,.1);border:1px solid rgba(205,170,74,.3);color:var(--accent);border-radius:8px;padding:7px 13px;font-size:12px;font-family:var(--font-mono);font-weight:700;letter-spacing:1px;display:flex;gap:7px;align-items:center;cursor:pointer}
.burg{display:none;background:none;border:none;color:var(--ink);font-size:22px;cursor:pointer}
#mobile-menu{display:none;background:var(--bg-1);border-top:1px solid var(--line);padding:20px 32px 28px;flex-direction:column;gap:16px}
@media(max-width:900px){.pcnav,.navbar__actions>.icon-btn,.navbar__actions>a.icon-btn{display:none}.burg{display:flex}}
@media(max-width:720px){.pcnav{display:none}.burg{display:flex}}

/* ============ SIDE DOTS ============ */
#sidenav{position:fixed;right:26px;top:50%;transform:translateY(-50%);z-index:200;display:flex;flex-direction:column;gap:16px}
@media(max-width:1100px){#sidenav{display:none}}
.dot-link{display:flex;align-items:center;gap:8px;text-decoration:none;justify-content:flex-end}
.dot-label{display:none;color:var(--accent);font-size:9px;font-weight:700;font-family:var(--font-mono);letter-spacing:2px;text-transform:uppercase}
.dot-indicator{width:6px;height:6px;border-radius:3px;background:var(--faint);transition:.4s}

/* ============ HERO ============ */
#hero{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:140px 32px 90px;text-align:center;position:relative}
.badge-pill{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(205,170,74,.3);border-radius:100px;padding:8px 22px;margin-bottom:44px;background:rgba(205,170,74,.06)}
.badge-pill__dot{width:7px;height:7px;border-radius:50%;background:var(--emerald);animation:pulse-dot 2.6s infinite}
.badge-pill__text{font-family:var(--font-mono);font-size:11px;color:var(--accent);letter-spacing:2.4px;font-weight:500}
.hero-eyebrow{font-family:var(--font-mono);font-size:clamp(10px,1.1vw,13px);color:var(--muted);letter-spacing:4px;margin-bottom:22px;text-transform:uppercase}
.hero-h1{font-family:var(--font-display);font-size:clamp(50px,8.6vw,112px);font-weight:600;line-height:.96;letter-spacing:-.04em;margin-bottom:32px}
.hero-h1 span{display:block}
.shimmer{background:linear-gradient(135deg,var(--accent),var(--accent-l) 50%,var(--accent));background-size:200% 100%;background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.hero-sub{font-family:var(--font-ui);font-size:clamp(15px,1.7vw,18px);color:var(--muted);line-height:1.7;max-width:560px;margin:0 auto 48px;font-weight:300}
.hero-ctas{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:84px;border-top:1px solid var(--line)}
.hero-stats>div{padding:26px 18px;border-right:1px solid var(--line)}
.hero-stats>div:last-child{border-right:none}
.hero-stats .num{font-family:var(--font-display);font-size:clamp(28px,3.6vw,48px);font-weight:600;color:var(--ink);line-height:1}
.hero-stats .lbl{font-family:var(--font-ui);color:var(--muted);font-size:12px;margin-top:6px}
@media(max-width:640px){.hero-stats{grid-template-columns:1fr 1fr}}
.scroll-cue{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}

/* Digital twin — signature element */
.twin{perspective:1100px;cursor:pointer;display:inline-block;position:relative;margin-bottom:34px}
.twin__flipper{transition:transform .8s cubic-bezier(.34,1.56,.64,1);transform-style:preserve-3d;position:relative;width:210px;height:210px}
.twin.flipped .twin__flipper,.twin:hover .twin__flipper{transform:rotateY(180deg)}
.twin__face{backface-visibility:hidden;position:absolute;inset:0;border-radius:50%;overflow:hidden}
.twin__front{border:4px solid var(--accent);box-shadow:0 8px 32px rgba(205,170,74,.28)}
.twin__front img{width:100%;height:100%;object-fit:cover}
.twin__back{border:4px solid var(--azure);background:var(--bg-2);transform:rotateY(180deg);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(77,127,196,.35)}
.twin__scan{position:absolute;top:0;left:0;width:100%;height:3px;background:var(--azure);box-shadow:0 0 10px var(--azure-l),0 0 20px var(--azure-l);animation:scan 2.4s ease-in-out infinite;opacity:.85}
@keyframes scan{0%,100%{top:0}50%{top:100%}}
.twin__hint{position:absolute;right:-88px;top:26px;background:var(--bg-3);border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:8px;font-size:11px;opacity:0;transform:translateX(-8px);transition:.4s;pointer-events:none}
.twin:hover .twin__hint{opacity:1;transform:none}

/* ============ SKILLS ============ */
.skill-title{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.skill-title__bar{width:2px;height:26px;border-radius:1px}
.skill-title h3{font-family:var(--font-display);font-size:20px;color:var(--ink)}
.skill-title p{font-family:var(--font-mono);font-size:11px;letter-spacing:2px;margin-top:2px}
.stack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:10px}
.stack-chip{background:var(--bg-3);border:1px solid var(--line);border-radius:12px;padding:13px 12px;text-align:center}
.stack-chip__name{font-weight:600;font-size:13px;color:var(--ink);margin-bottom:4px}
.stack-chip__sub{font-family:var(--font-mono);font-size:9px;letter-spacing:1px}
.bar-row{margin-bottom:14px}
.bar-row__top{display:flex;justify-content:space-between;margin-bottom:7px;font-size:13px}
.bar-track{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;width:0;transition:width 1s ease}
.lang-card{flex:1 0 110px;background:var(--bg-3);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.lang-card__top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;font-family:var(--font-mono);font-size:10px}
.lang-card__name{font-weight:600;font-size:14px;color:var(--ink);margin-bottom:9px}
.certif-row{display:flex;align-items:center;gap:32px;flex-wrap:wrap;padding:32px;background:var(--bg-3);border-color:var(--accent)!important}
.certif-chip{background:var(--bg-0);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:10px 16px;font-size:13px;display:flex;align-items:center;gap:8px}

/* ============ TIMELINE (xp + future) ============ */
.timeline{position:relative;padding-left:48px}
.timeline::before{content:"";position:absolute;left:18px;top:4px;bottom:4px;width:1px;background:var(--tl-gradient,var(--line))}
.timeline-list{display:flex;flex-direction:column;gap:22px}
.timeline-item{position:relative}
.timeline-dot{position:absolute;left:-36px;top:28px;width:32px;height:32px;border-radius:50%;background:var(--bg-0);border:2px solid var(--c);display:flex;align-items:center;justify-content:center;z-index:2}
.timeline-dot i{width:8px;height:8px;border-radius:50%;background:var(--c);display:block}
.tl-card{background:var(--bg-2);border:1px solid var(--line);border-radius:20px;padding:30px;border-left:3px solid var(--c)}
.tl-card__head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.tl-card__role{font-family:var(--font-display);font-size:21px;font-weight:600;color:var(--ink);margin-bottom:4px}
.tl-card__co{font-family:var(--font-mono);font-size:12px;color:var(--c);letter-spacing:1.4px}
.tl-card__period{display:inline-flex;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:6px 13px;font-family:var(--font-mono);font-size:11px;color:var(--c)}
.tl-card__loc{font-family:var(--font-mono);font-size:10px;color:var(--faint);display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:6px}
.tl-card ul{list-style:none;display:flex;flex-direction:column;gap:9px;margin:0 0 20px}
.tl-card li{display:flex;gap:11px;font-size:13px;color:var(--muted);line-height:1.6}
.tl-card li::before{content:"▸";color:var(--c);font-family:var(--font-mono);flex-shrink:0}
.tl-card__foot{display:flex;justify-content:space-between;align-items:flex-end}
.tag-row{display:flex;flex-wrap:wrap;gap:8px}
.pill-tag{background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--c);border-radius:6px;padding:4px 11px;font-size:11px;font-weight:600;font-family:var(--font-mono)}
.more-link{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:4px;opacity:.75}

/* ============ PROJECTS ============ */
.proj-card{display:flex;flex-direction:column}
.proj-card__cover{height:138px;position:relative;border-bottom:1px solid var(--line)}
.proj-card__wash{position:absolute;inset:0;background:radial-gradient(circle at bottom right,var(--c),var(--bg-2) 80%);opacity:.32;transition:transform .7s var(--ease)}
.proj-card:hover .proj-card__wash{transform:scale(1.08)}
.proj-card__index{position:absolute;top:14px;right:20px;font-family:var(--font-display);font-size:66px;font-weight:600;color:var(--c);opacity:.15;line-height:1}
.proj-card__type{position:absolute;top:22px;left:22px;font-family:var(--font-mono);font-size:10px;color:var(--c);padding:4px 10px;border:1px solid var(--c);border-radius:100px;background:var(--bg-0)}
.proj-card__overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;opacity:0;transition:.4s}
.proj-card:hover .proj-card__overlay{opacity:1}
.proj-card__body{padding:30px;flex:1;display:flex;flex-direction:column}
.proj-card__title{font-family:var(--font-display);font-size:23px;color:var(--ink);margin-bottom:11px}
.proj-card__desc{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:22px;flex-grow:1}
.kpi-row{display:flex;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.kpi-item{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--ink)}

/* ============ EDUCATION ============ */
.edu-card{padding:34px}
.edu-card__glowdot{position:absolute;bottom:-20px;right:-20px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,var(--c) 0%,transparent 70%);opacity:.15}
.edu-card__top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.edu-card__period{font-family:var(--font-mono);font-size:11px;color:var(--c);padding:4px 10px;border:1px solid var(--c);border-radius:6px;background:rgba(0,0,0,.2)}
.edu-card__loc{font-family:var(--font-mono);font-size:10px;color:var(--faint);display:flex;align-items:center;gap:4px}
.edu-card__school{font-family:var(--font-display);font-size:19px;margin-bottom:8px}
.edu-card__degree{font-size:13px;font-weight:500;color:var(--c);margin-bottom:18px}
.edu-card__desc{font-size:13px;color:var(--muted);line-height:1.65;margin-bottom:14px}

/* ============ RECOS ============ */
.reco-card{display:flex;align-items:center;gap:22px;padding:30px;position:relative}
.reco-card__bar{position:absolute;top:0;left:0;width:4px;height:100%;background:var(--c)}
.reco-card__icon{width:46px;height:46px;border-radius:12px;background:rgba(205,170,74,.1);border:1px solid rgba(205,170,74,.3);display:flex;align-items:center;justify-content:center;color:var(--c);flex-shrink:0}
.reco-card__name{font-family:var(--font-display);font-size:19px;color:var(--ink);margin-bottom:4px}
.reco-card__co{font-family:var(--font-mono);font-size:11px;color:var(--c);letter-spacing:1px;margin-bottom:8px}
.reco-card__link{font-size:13px;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px}

/* ============ WORLD MAP ============ */
.map-card{padding:30px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:280px;height:100%}
.map-card__grid{position:absolute;inset:0;opacity:.12;background-image:linear-gradient(var(--azure) 1px,transparent 1px),linear-gradient(90deg,var(--azure) 1px,transparent 1px);background-size:28px 28px}
@keyframes flow{to{stroke-dashoffset:0}}

/* ============ TERMINAL ============ */
.term-box{border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 36px 72px rgba(0,0,0,.55)}
.term-bar{background:var(--bg-3);padding:12px 20px;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.term-dots{display:flex;gap:7px}
.term-dots span{width:11px;height:11px;border-radius:50%;display:block}
.term-title{flex:1;text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
#term-content{background:var(--bg-0);padding:30px;font-family:var(--font-mono);font-size:13px;min-height:280px;line-height:2;overflow-y:auto}
.term-input-row{display:flex;gap:12px;align-items:center;margin-top:12px}
.term-input{background:transparent;border:none;color:var(--ink);font-family:var(--font-mono);font-size:13px;flex:1;outline:none;caret-color:var(--accent)}
@keyframes blink{50%{opacity:0}}

/* ============ CHATBOT ============ */
#bot-wrap{position:fixed;bottom:28px;left:28px;z-index:1000;display:flex;flex-direction:column;align-items:flex-start}
.bot-launcher{width:54px;height:54px;border-radius:50%;background:var(--bg-2);border:1px solid var(--accent);box-shadow:0 8px 24px rgba(205,170,74,.2);color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.bot-launcher:hover{transform:scale(1.08)}
.bot-launcher__ping{position:absolute;top:0;right:0;width:11px;height:11px;background:var(--emerald);border-radius:50%;border:2px solid var(--bg-0)}
.bot-window{opacity:0;transform:translateY(10px) scale(.95);transform-origin:bottom left;transition:opacity .3s,transform .3s cubic-bezier(.34,1.56,.64,1);display:none;position:absolute;bottom:68px;left:0;width:326px;height:440px;background:var(--bg-2);border:1px solid var(--line);border-radius:16px;flex-direction:column;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.6)}
.bot-header{background:var(--bg-3);padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;cursor:grab}
.bot-messages{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:11px}
.bot-msg{max-width:85%;padding:10px 13px;border-radius:12px;font-size:13px;line-height:1.5}
.bot-msg--bot{align-self:flex-start;background:var(--bg-3);color:var(--muted);border-bottom-left-radius:4px}
.bot-msg--user{align-self:flex-end;background:var(--accent);color:var(--bg-0);border-bottom-right-radius:4px}
.bot-suggestions{padding:8px 12px;background:var(--bg-0);border-top:1px solid var(--line);display:flex;gap:8px;overflow-x:auto}
.quick-reply{background:var(--bg-3);border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:100px;font-size:11px;cursor:pointer;white-space:nowrap;transition:.2s}
.quick-reply:hover{background:rgba(205,170,74,.1);border-color:var(--accent);color:var(--accent)}
.bot-inputbar{padding:12px;background:var(--bg-0)}
.bot-inputbar form{display:flex;gap:8px}
.bot-inputbar input{flex:1;background:transparent;border:none;outline:none;color:var(--ink);font-family:var(--font-ui);font-size:13px}
.bot-send{background:var(--accent);border:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--bg-0);flex-shrink:0}
.typing span{animation:blink 1.4s infinite;font-size:16px}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}

/* ============ MODAL ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(7,10,16,.85);backdrop-filter:blur(8px);z-index:9998;display:flex;justify-content:flex-end;opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-panel{width:100%;max-width:680px;height:100%;background:var(--bg-1);border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(0,0,0,.5);transform:translateX(100%);transition:transform .5s var(--ease);display:flex;flex-direction:column;overflow-y:auto}
.modal-overlay.open .modal-panel{transform:none}
.modal-head{padding:30px 40px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg-1);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-family:var(--font-display);font-size:27px;color:var(--ink);margin-bottom:4px}
.modal-head__sub{font-family:var(--font-mono);font-size:12px;color:var(--accent);letter-spacing:1.4px}
.modal-body{padding:40px;color:var(--muted);line-height:1.75;font-size:15px}
.modal-body h4{font-family:var(--font-display);font-size:23px;color:var(--ink);margin:28px 0 14px;font-weight:600}
.modal-body p{margin-bottom:15px}
.modal-body ul{margin-bottom:22px;padding-left:20px}
.modal-body li{margin-bottom:7px}
.modal-tags{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}

/* ============ BUSINESS CARD ============ */
.bcard{perspective:1200px;cursor:pointer;display:block;width:100%;max-width:560px;margin:0 auto 44px;aspect-ratio:16/9}
.bcard__flip{transition:transform .8s cubic-bezier(.34,1.56,.64,1);transform-style:preserve-3d;position:relative;width:100%;height:100%}
.bcard.flipped .bcard__flip{transform:rotateY(180deg)}
.bcard__face{backface-visibility:hidden;position:absolute;inset:0;border-radius:12px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.4);border:1px solid var(--line)}
.bcard__face img{width:100%;height:100%;object-fit:cover}
.bcard__back{transform:rotateY(180deg)}
.bcard-hint{font-family:var(--font-mono);font-size:10px;color:var(--accent);text-align:center;margin-top:14px;letter-spacing:2px;animation:pulse-text 2s infinite}
@keyframes pulse-text{50%{opacity:.5}}

/* ============ CONTACT ============ */
.contact-panel{padding:70px 50px;position:relative;overflow:hidden;margin-bottom:44px;border-color:rgba(205,170,74,.2)!important;text-align:center}
.contact-panel::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:200px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.contact-links{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin:44px 0 8px}
.footer-bottom{margin-top:60px;border-top:1px solid var(--line);padding-top:36px;color:var(--faint);font-size:11px;font-family:var(--font-mono);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

#scroll-top{position:fixed;bottom:30px;right:30px;z-index:900;opacity:0;pointer-events:none;transform:translateY(16px);transition:.3s cubic-bezier(.34,1.56,.64,1)}
#scroll-top.visible{opacity:1;pointer-events:all;transform:none}

/* ============ CMD PALETTE ============ */
#cmd-palette{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);z-index:9999;align-items:flex-start;justify-content:center;padding-top:10vh;opacity:0;transition:opacity .2s}
.cmd-box{width:100%;max-width:600px;background:var(--bg-2);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.5);overflow:hidden;transform:scale(.95);transition:transform .2s}
.cmd-search{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.cmd-search input{background:transparent;border:none;color:var(--ink);font-size:16px;flex:1;outline:none}
.cmd-results{padding:12px;max-height:400px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.cmd-item{padding:12px 16px;border-radius:10px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:background .2s}
.cmd-item:hover{background:var(--bg-3)}
</style>
</head>

function hexToRgb(hex){const n=parseInt(hex.replace('#',''),16);return `${(n>>16)&255},${(n>>8)&255},${n&255}`;}
function hexToRgbA(hex,a){if(!/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex))return `rgba(200,200,200,${a})`;let c=hex.substring(1).split('');if(c.length===3)c=[c[0],c[0],c[1],c[1],c[2],c[2]];c='0x'+c.join('');return `rgba(${(c>>16)&255},${(c>>8)&255},${c&255},${a})`;}

function formatText(text){
  const glossary=DICT[currentLang].glossary;
  if(!text||!glossary)return text||'';
  let res=text;
  for(const[term,def] of Object.entries(glossary)){
    res=res.replace(new RegExp(`\\b(${term})\\b`,'g'),`<span class="term" data-def="${def}">$1</span>`);
  }
  return res;
}

      <div id="term-content"></div>
    </div></div>`;
}
function runTermAnim(){
  const tc=$('term-content');if(!tc)return;
  const lines=DICT[currentLang].termLines,cmd=DICT[currentLang].termCmd;
  let html=`<div style="display:flex;gap:12px"><span style="color:var(--accent)">❯</span><span style="color:var(--ink)">${cmd}</span></div>`;
  tc.innerHTML=html;let delay=0;
  lines.forEach((l,i)=>{
    delay+=550+Math.random()*350;
    setTimeout(()=>{
      const cmap={info:'var(--azure)',code:'var(--lilac)',ok:'var(--emerald)'};
      html+=`<div style="color:${cmap[l.t]||'var(--muted)'};padding-left:4px">${l.s}</div>`;
      if(i===lines.length-1){setTimeout(()=>renderInteractivePrompt(tc,html),700);}
      else{tc.innerHTML=html+`<div style="margin-top:10px;display:flex;gap:12px"><span style="color:var(--accent)">❯</span><span style="width:7px;height:16px;background:var(--ink);animation:blink 1s step-end infinite"></span></div>`;}
    },delay);
  });
}
function renderInteractivePrompt(container,historyHtml){
  container.innerHTML=historyHtml+`<div id="term-history"></div><div class="term-input-row"><span style="color:var(--accent)">❯</span><input type="text" id="term-input" class="term-input" autocomplete="off" spellcheck="false" placeholder="Tapez 'help'..."></div>`;
  const input=$('term-input'),box=container.parentElement;
  box.style.cursor='text';box.onclick=()=>input.focus();
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){const v=input.value.trim();if(v)processTerminalCommand(v);input.value='';}});
}
function processTerminalCommand(cmd){
  const hist=$('term-history');let response='';const c=cmd.toLowerCase();
  if(c==='help'){response=`Commandes : <span style="color:var(--azure)">clear</span> nettoyer · <span style="color:var(--azure)">skills</span> compétences · <span style="color:var(--azure)">contact</span> coordonnées · <span style="color:var(--azure)">theme &lt;nom&gt;</span> changer de thème<br>… ou posez une question naturelle`;}
  else if(c==='clear'){hist.innerHTML='';return;}
  else if(c.startsWith('theme')){
    const parts=c.split(' ');
    response=(parts.length>1&&THEMES[parts[1]])?(setTheme(parts[1]),`> Thème changé : ${THEMES[parts[1]].name}`):`> Thèmes dispos : wada1..wada10`;
  } else {response=`<span style="color:var(--accent)">›</span> `+getBotResponse(cmd);}
  hist.innerHTML+=`<div style="display:flex;gap:12px;margin-top:4px"><span style="color:var(--accent)">❯</span><span style="color:var(--ink)">${cmd}</span></div><div style="color:var(--muted);padding-left:4px;margin-bottom:8px">${response}</div>`;
  $('term-content').scrollTop=$('term-content').scrollHeight;
}

/* ============================================================

function renderBot(t){
  const wrap=$('bot-wrap');if(!wrap)return;
  const suggestions=(t.chatSuggestions||[]).map(s=>`<button class="quick-reply" onclick="triggerQuickReply('${s}')">${s}</button>`).join('');
  wrap.innerHTML=`
    <div id="ai-chat-window" class="bot-window">
      <div id="ai-chat-header" class="bot-header"><div style="display:flex;align-items:center;gap:8px"><i data-lucide="bot" style="color:var(--accent);width:18px"></i><span style="font-family:var(--font-mono);font-size:11px;font-weight:bold">Digital Twin AI</span></div><button class="icon-btn" style="width:30px;height:30px" onclick="toggleAIBot()"><i data-lucide="x" style="width:14px"></i></button></div>
      <div id="ai-chat-messages" class="bot-messages"><div class="bot-msg bot-msg--bot">${t.botGreeting}</div></div>
      <div class="bot-suggestions">${suggestions}</div>
      <div class="bot-inputbar"><form onsubmit="handleAIChatSubmit(event)"><input type="text" id="ai-chat-input" placeholder="..." autocomplete="off"><button type="submit" class="bot-send"><i data-lucide="send" style="width:14px"></i></button></form></div>
    </div>
    <button onclick="toggleAIBot()" class="bot-launcher"><i data-lucide="message-square" style="width:22px"></i><span class="bot-launcher__ping"></span></button>`;
}
function makeChatDraggable(){
  let dragging=false,ox,oy,win;
  document.addEventListener('mousedown',e=>{
    if(e.target.closest('#ai-chat-header')){win=$('ai-chat-window');if(!win)return;dragging=true;const r=win.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;win.style.bottom='auto';win.style.right='auto';win.style.position='fixed';win.style.left=`${r.left}px`;win.style.top=`${r.top}px`;}
  });
  document.addEventListener('mousemove',e=>{if(dragging&&win){win.style.left=`${e.clientX-ox}px`;win.style.top=`${e.clientY-oy}px`;}});
  document.addEventListener('mouseup',()=>dragging=false);
}
function toggleAIBot(){
  const w=$('ai-chat-window');if(!w)return;
  if(w.style.display!=='flex'){w.style.display='flex';setTimeout(()=>{w.style.opacity='1';w.style.transform='translateY(0) scale(1)';$('ai-chat-input')?.focus();},10);}
  else{w.style.opacity='0';w.style.transform='translateY(10px) scale(.95)';setTimeout(()=>w.style.display='none',300);}
}
function triggerQuickReply(text){const inp=$('ai-chat-input');if(inp){inp.value=text;handleAIChatSubmit(new Event('submit'));}}
function showTyping(){const box=$('ai-chat-messages');const d=document.createElement('div');d.id='typing-indicator';d.className='bot-msg bot-msg--bot typing';d.innerHTML='<span>.</span><span>.</span><span>.</span>';box.appendChild(d);box.scrollTop=box.scrollHeight;}
function removeTyping(){$('typing-indicator')?.remove();}
function typeWriter(el,text,i=0){if(i===0)el.innerHTML='';if(text.includes('<')){el.innerHTML=text;return;}if(i<text.length){el.innerHTML+=text.charAt(i);setTimeout(()=>typeWriter(el,text,i+1),12+Math.random()*18);}}
function handleAIChatSubmit(e){
  if(e?.preventDefault)e.preventDefault();
  const input=$('ai-chat-input');if(!input)return;
  const val=input.value.trim();if(!val)return;
  appendChatMessage(val,'user');input.value='';showTyping();
  setTimeout(()=>{removeTyping();appendChatMessage(getBotResponse(val),'bot');},500+Math.random()*500);
}
function appendChatMessage(text,sender){
  const box=$('ai-chat-messages');const d=document.createElement('div');
  d.className=`bot-msg bot-msg--${sender}`;
  if(sender==='user')d.textContent=text;else typeWriter(d,text);
  box.appendChild(d);box.scrollTop=box.scrollHeight;
}
function getBotResponse(cmd){
  const c=cmd.toLowerCase(),t=(DICT[currentLang]||DICT.fr).chat;
  const kw={dispo:['dispo','contrat','quand','date','v.i.e','vie','novembre','start','available','verfügbar','доступ'],mob:['mobilit','pays','où','ou ','destination','singapour','allemagne','australie','location','wo','где'],pitch:['qui','pitch','présentation','about','toi','you','wer','кто'],proud:['fiert','succes','succès','projet','best','appsheet','proud','stolz','гордость'],hobbies:['hobby','sport','passion','perso','freizeit','хобби'],flaw:['defaut','défaut','faiblesse','weakness','flaw','schwäche','недостаток'],stack:['stack','outils','tools','tech','технолог']};
  if(c.includes('contact'))return `Email : chaumenyr@gmail.com`;
  for(const[key,words] of Object.entries(kw)){if(words.some(w=>c.includes(w)))return t[key];}
  return (DICT[currentLang]||DICT.fr).botFallback;
}

function applyTheme(id){
  const th=THEMES[id],root=document.documentElement;
  for(const[k,cssVar] of Object.entries(THEME_VAR_MAP)){root.style.setProperty(`--${cssVar}`,th[k]);}
}
function toggleDD(id){document.querySelectorAll('.dd').forEach(el=>{if(el.id!==id)el.classList.remove('open');});$(id).classList.toggle('open');}

/* ============================================================
   SCROLL / REVEAL / COUNTERS
   ============================================================ */
function initObservers(){
  if(activeObserver)activeObserver.disconnect();
  activeObserver=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting&&e.target.classList.contains('reveal')){
        e.target.classList.add('on');
        e.target.querySelectorAll('.bar-fill').forEach(b=>b.style.width=b.dataset.width+'%');
        if(e.target.classList.contains('term-box')&&!e.target.dataset.run){e.target.dataset.run='1';runTermAnim();}
      }
    });
  },{threshold:.1});
  document.querySelectorAll('.reveal').forEach(el=>activeObserver.observe(el));
}
function initCounters(){
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){e.target.querySelectorAll('.stat-counter').forEach(el=>{
        if(el.dataset.done)return;el.dataset.done='1';
        const target=parseFloat(el.dataset.target);let start;
        const step=ts=>{if(!start)start=ts;const p=Math.min((ts-start)/1400,1);el.textContent=Math.round((1-Math.pow(1-p,4))*target);if(p<1)requestAnimationFrame(step);};
        requestAnimationFrame(step);
      });}
    });
  });
  const hs=document.querySelector('.hero-stats');if(hs)obs.observe(hs);
}
function setupEventListeners(){
  document.addEventListener('click',e=>{if(!e.target.closest('.dd'))document.querySelectorAll('.dd').forEach(el=>el.classList.remove('open'));});
  document.addEventListener('keydown',e=>{
    if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();toggleCmdPalette();}
    if(e.key==='Escape'){document.querySelectorAll('.dd').forEach(el=>el.classList.remove('open'));closeMobileMenu();if($('cmd-palette')?.style.display==='flex')toggleCmdPalette();if($('global-modal').classList.contains('open'))closeModal();}
  });
  window.addEventListener('scroll',()=>{
    const mid=window.scrollY+window.innerHeight*.4;let active=SIDS[0];
    for(let i=SIDS.length-1;i>=0;i--){const el=$(SIDS[i]+'-wrap');if(el&&el.offsetTop<=mid){active=SIDS[i];break;}}
    document.querySelectorAll('.nav-link').forEach(l=>{const on=l.getAttribute('href')===anchorFor(active);l.style.background=on?'rgba(255,255,255,.05)':'transparent';l.style.color=on?'var(--ink)':'var(--muted)';});
    document.querySelectorAll('.dot-link').forEach(l=>{const on=l.getAttribute('href')===anchorFor(active);const ind=l.querySelector('.dot-indicator'),lbl=l.querySelector('.dot-label');if(ind){ind.style.background=on?'var(--accent)':'var(--faint)';ind.style.width=on?'24px':'6px';}if(lbl)lbl.style.display=on?'block':'none';});
    const nb=$('navbar');if(nb){nb.style.background=window.scrollY>20?'rgba(7,10,16,.85)':'transparent';nb.style.backdropFilter=window.scrollY>20?'blur(20px)':'none';nb.style.borderBottom=window.scrollY>20?'1px solid rgba(255,255,255,.05)':'none';}
    const sl=$('scroll-line');if(sl)sl.style.width=(window.scrollY/(document.documentElement.scrollHeight-window.innerHeight)*100)+'%';
    const st=$('scroll-top');if(st)st.classList.toggle('visible',window.scrollY>400);
  },{passive:true});
}

/* ============================================================
   PARTICLE CANVAS — data-flow motif
   ============================================================ */
function initCanvas(){
  if(canvasRAF){cancelAnimationFrame(canvasRAF);canvasRAF=null;}
  const canvas=$('particle-canvas');if(!canvas)return;
  const ctx=canvas.getContext('2d');let mouse={x:-999,y:-999};
  const resize=()=>{canvas.width=innerWidth;canvas.height=innerHeight;};
  addEventListener('resize',resize,{passive:true});resize();
  addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;},{passive:true});
  const pts=Array.from({length:48},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*1.2+.4,ph:Math.random()*Math.PI*2,col:['accent','azure','muted','faint'][Math.floor(Math.random()*4)],ch:Math.random()>.5?'1':'0'}));
  const draw=ts=>{
    if(!isPageVisible){canvasRAF=requestAnimationFrame(draw);return;}
    if(isHackMode){
      ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#10d68a';ctx.font='14px monospace';
      pts.forEach(p=>{p.y+=3+Math.random()*2;if(p.y>canvas.height){p.y=0;p.x=Math.random()*canvas.width;}if(Math.random()<.05)p.ch=Math.random()>.5?'1':'0';ctx.fillText(p.ch,p.x,p.y);});
    }else{
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const cA=hexToRgb(getVar('accent')),cF=hexToRgb(getVar('faint'));
      pts.forEach(p=>{const d=Math.hypot(mouse.x-p.x,mouse.y-p.y);if(d<180){ctx.beginPath();ctx.strokeStyle=`rgba(${cA},${.15*(1-d/180)})`;ctx.moveTo(p.x,p.y);ctx.lineTo(mouse.x,mouse.y);ctx.stroke();}});
      for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);if(d<120){ctx.beginPath();ctx.strokeStyle=`rgba(${cF},${.3*(1-d/120)})`;ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.stroke();}}
      pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>canvas.width)p.vx*=-1;if(p.y<0||p.y>canvas.height)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1+(Math.sin(ts*.001+p.ph)*.5+.5)*.4),0,Math.PI*2);ctx.fillStyle=`rgba(${hexToRgb(getVar(p.col))},.6)`;ctx.fill();});
    }
    canvasRAF=requestAnimationFrame(draw);
  };
  canvasRAF=requestAnimationFrame(draw);
}

/* ============================================================
   CUSTOM CURSOR
   ============================================================ */
function initCursor(){
  if(!matchMedia("(pointer:fine)").matches)return;
  const dot=$('cursor-dot'),ring=$('cursor-ring');dot.style.display='block';ring.style.display='block';
  let mx=-200,my=-200,rx=-200,ry=-200,hov=false;
  addEventListener('mousemove',e=>{
    mx=e.clientX;my=e.clientY;
    const target=e.target.closest('.card--interactive');
    if(target){const r=target.getBoundingClientRect();target.style.setProperty('--mx',`${e.clientX-r.left}px`);target.style.setProperty('--my',`${e.clientY-r.top}px`);}
  },{passive:true});
  document.addEventListener('mouseover',e=>{if(e.target.closest('a,button,[role=button],input,.twin,.term,.quick-reply,.card--interactive'))hov=true;});
  document.addEventListener('mouseout',()=>hov=false);
  const tick=()=>{
    rx+=(mx-rx)*.15;ry+=(my-ry)*.15;
    dot.style.transform=`translate(${mx-4}px,${my-4}px) scale(${hov?.3:1})`;
    ring.style.transform=`translate(${rx-19}px,${ry-19}px) scale(${hov?2:1})`;
    ring.style.opacity=hov?'.5':'.3';
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

addEventListener('load',()=>{
  init();
  setTimeout(()=>{const p=$('preloader');if(p){p.style.opacity='0';p.style.visibility='hidden';setTimeout(()=>p.remove(),700);}},900);
});
